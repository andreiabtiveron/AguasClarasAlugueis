services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/aguasclaras2026"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p aguasclaras2026 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 8
      start_period: 25s

  aguas-claras:
    build: .
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DEFAULT_PROPERTY_LIMIT: "48"
      NESTORIA_PLACE: "Aguas Claras DF"
      NEO4J_ENABLED: "true"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "aguasclaras2026"
      NEO4J_DATABASE: "neo4j"

volumes:
  neo4j_data:
  neo4j_logs:
